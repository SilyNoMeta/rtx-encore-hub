name: Feature request / Suggestion
description: Suggest an improvement to the Hub. / Proposer une amélioration du Hub.
title: "[Suggestion] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do? / Quel besoin cela résoudrait-il ?
      description: Describe your workflow and what currently gets in the way. / Décrivez votre usage et ce qui vous gêne aujourd'hui.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behavior / Comportement proposé
      description: Describe the change and any useful examples. / Décrivez le changement et des exemples utiles.
    validations:
      required: true
