name: Bug report
description: Report a reproducible problem with the RTX Encore Hub program.
title: "[Hub] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **You can write in any language.** The form is in English, but reports in French, Chinese or any other language are welcome: write in the one you are most comfortable with.

        For a rendering, frame generation or game compatibility problem with the mod itself, use the [RTX Encore issue tracker](https://github.com/SilyNoMeta/rtx-encore/issues). Remove personal paths and account details from attachments.
  - type: input
    id: hub-version
    attributes:
      label: Hub version
      description: The version shown in the Hub, and where you downloaded it.
      placeholder: "1.2.0-beta.1, GitHub release"
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Setup
      description: Windows version, GPU and NVIDIA driver, the game and its version, its launcher or store, and the RTX Encore version installed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and result
      description: Steps to reproduce, what you expected, what happened instead, and the exact error message.
    validations:
      required: true
  - type: textarea
    id: restore
    attributes:
      label: Restore and attachments
      description: |
        For a game-specific problem, reproduce it, open the game in the Hub, go to Health and choose Prepare a diagnostic. Review the archive for personal information, then drag and drop it here; the Hub does not upload it automatically. If relevant, did Restore help? If the Hub cannot open or the diagnostic fails, explain why and attach the available Hub logs and redacted screenshots. XeSS/XeFG rendering issues belong in the mod tracker linked above, with the same diagnostic archive.
    validations:
      required: true
